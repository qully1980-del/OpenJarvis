name: Propuesta de mejora
description: Propón una función nueva o una mejora
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Para cambios no triviales, abre este issue para comentarlo antes de empezar una pull request. Así detectamos pronto los problemas de diseño y nadie pierde tiempo.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué problema resuelve? ¿Por qué hace falta?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solución propuesta
      description: Describe cómo te gustaría que funcionara.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      description: ¿Qué parte de OpenJarvis afecta?
      options:
        - Traducción al castellano
        - Tema Aurora / interfaz
        - Motor Claude Code
        - Extras de Windows (app, indexador, noticias, actualizador)
        - Intelligence
        - Engine
        - Agent
        - Tools
        - Learning
        - Evals
        - Channels
        - Rust
        - Otra
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Otras soluciones o funciones que hayas considerado.
    validations:
      required: false
