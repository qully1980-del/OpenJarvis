name: Validación de modelo Pearl
description: Seguimiento de la conversión y validación de un modelo de minería compatible con Pearl
labels: ["type:feature", "area:mining"]
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla al convertir un modelo de Hugging Face en un modelo
        de minería compatible con Pearl (`pearl-ai/*-pearl`). El modelo debe
        seguir como `planned` en OpenJarvis hasta completar esta lista.
  - type: input
    id: raw_model
    attributes:
      label: Modelo original
      placeholder: p. ej., Qwen/Qwen3.5-9B
    validations:
      required: true
  - type: input
    id: pearl_model
    attributes:
      label: Artefacto del modelo Pearl
      placeholder: p. ej., pearl-ai/Qwen3.5-9B-pearl
    validations:
      required: true
  - type: dropdown
    id: target_provider
    attributes:
      label: Proveedor de destino
      options:
        - vllm-pearl
        - cpu-pearl
        - apple-mps-pearl
    validations:
      required: true
  - type: textarea
    id: quantization_recipe
    attributes:
      label: Receta de cuantización
      description: Enlaza o pega la receta usada para crear el artefacto del modelo Pearl.
      placeholder: |
        - configuración de compressed-tensors:
        - capas de minería a 7 bits:
        - capas que no son de minería a 8 bits:
        - datos de calibración:
        - ajustes de SmoothQuant:
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware de validación
      placeholder: |
        - GPU:
        - VRAM:
        - controlador/CUDA:
        - imagen/etiqueta de Docker:
        - commit/ref de Pearl:
    validations:
      required: true
  - type: checkboxes
    id: acceptance
    attributes:
      label: Comprobaciones de aceptación
      options:
        - label: El modelo carga en el contenedor del minero vLLM de Pearl
          required: true
        - label: vLLM registra el plugin de cuantización de Pearl
          required: true
        - label: Las capas de minería usan int7 NoisyGEMM
          required: true
        - label: Las capas que no son de minería usan int8 GEMM estándar de Pearl
          required: true
        - label: "`jarvis mine init --model <id-del-modelo-pearl>` funciona"
          required: true
        - label: "`jarvis mine start` funciona"
          required: true
        - label: "`jarvis ask` funciona a través del motor de minería"
          required: true
        - label: "`jarvis mine status` muestra las métricas del gateway y de minería"
          required: true
        - label: "`jarvis mine validate-model --allow-planned` pasa"
          required: true
        - label: Los registros del gateway y del minero no muestran errores de envío
          required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Artefactos
      description: Adjunta registros, métricas, configuración del modelo y salida de los comandos.
      placeholder: |
        - salida de /v1/models:
        - salida de `jarvis mine status`:
        - JSON de `jarvis mine validate-model --output`:
        - extracto de métricas del gateway:
        - registros del minero:
        - PR/commit que cambia el estado a validated:
    validations:
      required: true
