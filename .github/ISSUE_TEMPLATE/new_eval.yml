name: Nuevo conjunto de evaluación
description: Propón un nuevo conjunto de datos de evaluación o benchmark
labels: ["type:eval"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Añadir conjuntos de evaluación es una de las formas más fáciles de contribuir! Rellena los datos siguientes.
  - type: input
    id: name
    attributes:
      label: Nombre del conjunto de datos
      placeholder: p. ej., HumanEval, GSM8K
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL / referencia
      description: Enlace al conjunto de datos o al artículo.
      placeholder: https://...
    validations:
      required: true
  - type: checkboxes
    id: capability
    attributes:
      label: ¿Qué capacidad evalúa?
      options:
        - label: Razonamiento
        - label: Matemáticas
        - label: Código
        - label: Conocimiento
        - label: Multimodal
        - label: Uso de herramientas
        - label: Contexto largo
        - label: Otra
  - type: input
    id: size
    attributes:
      label: Tamaño aproximado
      description: Número de ejemplos del conjunto de datos.
      placeholder: p. ej., 500
    validations:
      required: false
  - type: dropdown
    id: scorer
    attributes:
      label: Tipo de puntuación propuesto
      options:
        - Coincidencia exacta
        - F1
        - BLEU
        - LLM como juez
        - Personalizado
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Cualquier otro detalle sobre el conjunto de datos.
    validations:
      required: false
