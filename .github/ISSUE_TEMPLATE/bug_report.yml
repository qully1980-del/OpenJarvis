name: Informe de error
description: Comunica un error o un comportamiento inesperado
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por comunicar el error! Rellena la información siguiente para ayudarnos a investigarlo.
        **No incluyas datos personales, de clientes ni secretos** en la descripción ni en los registros.
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Una descripción clara del error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Pasos para reproducir el comportamiento.
      placeholder: |
        1. Ejecuta `jarvis ask "..."`
        2. Aparece el error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Lo que esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento real
      description: Lo que ocurrió en realidad.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: python
    attributes:
      label: Versión de Python
      options:
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
    validations:
      required: true
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - GPU NVIDIA
        - GPU AMD
        - Apple Silicon
        - Solo CPU
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Motor
      description: ¿Qué motor de inferencia usas?
      options:
        - Ollama
        - Claude Code (headless)
        - vLLM
        - llama.cpp
        - SGLang
        - MLX
        - Nube (OpenAI/Anthropic/Google)
        - LiteLLM
        - Otro
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Registros / traza
      description: Pega aquí los registros o la traza relevantes (por ejemplo, de `%USERPROFILE%\.openjarvis\logs\app-server.log`).
      render: shell
    validations:
      required: false
